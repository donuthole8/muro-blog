      <stop offset="0" stop-color="#1c2b57"/>
      <stop offset="1" stop-color="#3557d6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <rect x="80" y="80" width="112" height="112" rx="28" fill="rgba(255,255,255,0.12)"/>
  <text
