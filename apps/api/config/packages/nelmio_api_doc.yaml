nelmio_api_doc:
    documentation:
        info:
            title: times API
            description: times（分報）サービスの API。openapi-typescript / openapi-fetch がこの spec を消費する。
            version: 1.0.0
        servers:
            - url: http://127.0.0.1:8000
              description: ローカル開発
        components:
            securitySchemes:
                SessionToken:
                    type: http
                    scheme: bearer
                    description: Google ログインで発行したセッショントークン。Worker が Cookie から載せ替えて送る
    areas:
        default:
            path_patterns:
                - ^/api(?!/doc)
